<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strengtn</title>
    <style>
        .container{
               height: 300px;
               width: 300px;
               background-color: rgb(106, 233, 233);
               margin: auto;
               margin-top: 200px;
               display: flex;
               flex-direction: column;
               align-items: center;
               justify-content: center;
               border-radius: 10px;
        }
        #password{
            padding: 10px;
            border-radius: 5px;
            background-color: white;
            border: 1px solid black;
        }
         #message{
            display: none;
        } 
    </style>
</head>
<body>
    <div class="container">
        <input type="password" placeholder="Password" id="password">
        <p id="message">Password is <span id="strength"></span></p>
    </div>
</body>
<script>
    let password = document.getElementById("password");
    let message = document.getElementById("message");
    let strength = document.getElementById("strength");

    password.addEventListener("input",()=>{
        if(password.value.length > 0 && password.value.length < 4){
            message.style.display = "block";
            message.style.color = "white";
            strength.innerText = "Weak";
            strength.style.color = "red";
        }
        else if(password.value.length > 4 && password.value.length <= 7){
             message.style.display = "block";
            message.style.color = "white";
            strength.innerText = "Mediume";
            strength.style.color = "yellow";
        }
        else if(password.value.length > 8){
            message.style.display = "block";
            message.style.color = "white";
            strength.innerText = "strong";
            strength.style.color = "green";
        }
    })
</script>
</html>
