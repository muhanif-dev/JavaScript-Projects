<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ring Size Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
         <div class="ring-size-calculatore">
            <div class="heading">
                   <h1>Place Ring On Circle</h1>
            <div class="line"></div>
            </div>
            
             <div class="upper">

            <div  id="ring" class="ring"></div>
            <div class="display-size" id="display-size">14.90 mm </div>

         </div>
        
    <input type="range" id="input" value="46.8" min="46.8" max="75" class="range-slider" >

    </div>
    <div class="values">
        <div class="heading">
              <h1>Ring Size Calculator</h1>
        <div class="line"></div>
        </div>
        
        <div class="size-mm" id="size-mm"> 14.90 </div>
        <div class="us-size" id="us-size"> 4</div>
        <div class="chart"><a href="df252ca354e3a288747421b0d69df131.jpg" download="hanif"><h1>View Size Chart</h1></a></div>
        </div>
    </div>
    </div>
    
    <script src="logical.js"></script>
</body>
</html>
